databases:
  - name: mandakhrank-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: mandakhrank_db
    user: mandakhrank_db_user
    ipAllowList: []
services:
  - type: web
    name: mandakhrank-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_problems && python manage.py seed_courses && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandakhrank-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: '0'
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
