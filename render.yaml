# Sync your EXISTING Blueprint/service. Do not create another free database.
# The existing mandakhrank-db is in Oregon; no new database is declared here.
services:
  - type: web
    name: mandakhrank-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_problems --if-empty && python manage.py seed_courses --if-empty && python manage.py serve
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandakhrank-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: '0'
      - key: GMAIL_SCRIPT_URL
        sync: false
      - key: GMAIL_SCRIPT_SECRET
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
